<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenübersicht</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #1d2a26; --muted: #66756f;
    --line: #dde3df; --accent: #1f6f5c; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a18; --card: #1f2623; --ink: #e8eeeb; --muted: #93a39c;
            --line: #2f3a36; --accent: #4fb89d; --accent-ink: #0d1512; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: 10px; padding-bottom: env(safe-area-inset-bottom, 10px); }
  .nav { display: flex; gap: 8px; align-items: stretch; margin-bottom: 12px; }
  .nav button { width: 48px; font-size: 22px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 10px; }
  .nav button:active { background: var(--accent); color: var(--accent-ink); }
  .nav select { flex: 1; min-width: 0; font-size: 17px; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); }
  .sports { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .sport { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 0; color: var(--muted); font-size: 12px; padding: 0; }
  .sport .ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--line); background: var(--card); transition: background .15s; }
  .sport svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .sport svg .f { fill: currentColor; stroke: none; }
  .sport[aria-pressed="true"] { color: var(--ink); }
  .sport[aria-pressed="true"] .ico { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  h2 { font-size: 15px; font-weight: 600; margin: 16px 2px 6px; color: var(--muted); }
  .scroll { overflow-x: auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { padding: 9px 12px; text-align: right; white-space: nowrap;
    border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  td.rk { font-weight: 700; color: var(--accent); width: 1%; }
  th:first-child, td:first-child { padding-right: 0; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  tfoot td { font-weight: 700; border-top: 2px solid var(--accent); }
  .empty { padding: 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="nav">
  <button id="prev" aria-label="Vorherige Woche">‹</button>
  <select id="week" aria-label="Woche wählen"></select>
  <button id="next" aria-label="Nächste Woche">›</button>
</div>
<div class="sports" id="sports"></div>
<div id="out"><div class="empty">Spalten zuordnen (rechtes Panel) …</div></div>

<script>
let rows = [], labels = [], weeks = [], current = null;
const $ = id => document.getElementById(id);

const SPORTS = [
  { key: 'rad', label: 'Radfahren', re: /rad|bike|cycl/i,
    svg: '<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5M10 9l3 7M13 16l2.5-7M15.5 9l-1-2.5h2.5"/>' },
  { key: 'lauf', label: 'Laufen', re: /lauf|run|jog/i,
    svg: '<circle class="f" cx="15" cy="5" r="1.9"/><path d="M14 8l-3 6M14 8l3 3M14 8l-4 1M11 14l4 2-1 4M11 14l-3 4h-3"/>' },
  { key: 'geh', label: 'Gehen', re: /geh|wander|walk/i,
    svg: '<circle class="f" cx="12" cy="5" r="1.9"/><path d="M12 8v6M12 9l-3 3M12 9l3 3M12 14l-2.5 6M12 14l2.5 6"/>' },
  { key: 'schwimm', label: 'Schwimmen', re: /schwimm|swim/i,
    svg: '<circle class="f" cx="16" cy="7" r="1.9"/><path d="M4 12l6-3 4 1M3 16q2.5-2 5 0t5 0 5 0M3 20q2.5-2 5 0t5 0 5 0"/>' },
];
const active = Object.fromEntries(SPORTS.map(x => [x.key, true]));
function sportKey(v) {
  const t = String(v ?? '');
  const hit = SPORTS.find(x => x.re.test(t));
  return hit ? hit.key : '';
}
$('sports').innerHTML = SPORTS.map(x =>
  `<button class="sport" data-k="${x.key}" aria-pressed="true" aria-label="${x.label}">
     <span class="ico"><svg viewBox="0 0 24 24">${x.svg}</svg></span>${x.label}</button>`).join('');
document.querySelectorAll('.sport').forEach(b => b.onclick = () => {
  const k = b.dataset.k; active[k] = !active[k];
  b.setAttribute('aria-pressed', active[k]); render();
});

grist.ready({
  requiredAccess: 'read table',
  columns: [
    { name: 'Datum', title: 'Datum', type: 'Date,DateTime' },
    { name: 'Teilnehmer', title: 'Teilnehmer', type: 'Any' },
    { name: 'Art', title: 'Bewegungsart', type: 'Any', optional: true },
    { name: 'Strecke', title: 'Strecke (Ranking)', type: 'Numeric,Int', optional: true },
    { name: 'Werte', title: 'Weitere Zahlenspalten', type: 'Numeric,Int', allowMultiple: true, optional: true },
  ],
});

// Grist liefert Datum/DatumUhrzeit als Sekunden seit 1970
function toDate(v) {
  if (v instanceof Date) return v;
  if (typeof v !== 'number') return null;
  return new Date(v < 1e11 ? v * 1000 : v);
}

// ISO-Kalenderwoche als Schlüssel "2026-KW40" plus Montag der Woche
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  const monday = new Date(t); monday.setUTCDate(t.getUTCDate() - day + 1);
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const year = t.getUTCFullYear();
  const wk = Math.ceil(((t - Date.UTC(year, 0, 1)) / 864e5 + 1) / 7);
  return { key: year + '-KW' + String(wk).padStart(2, '0'), monday };
}

const fmt = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', timeZone: 'UTC' });
const num = n => n.toLocaleString('de-DE', { maximumFractionDigits: 2 });

grist.onRecords((records, mappings) => {
  const m = grist.mapColumnNames(records);
  if (!m) { $('out').innerHTML = '<div class="empty">Bitte Datum und Teilnehmer zuordnen.</div>'; return; }
  const hasS = !!(mappings && mappings.Strecke);
  labels = (hasS ? [mappings.Strecke] : []).concat((mappings && mappings.Werte) || []);
  window.diag = records.length + ' Zeilen, Beispiel Datum: ' + typeof m[0]?.Datum + ' ' + String(m[0]?.Datum);
  rows = [];
  for (const r of m) {
    const d = toDate(r.Datum);
    if (!d) continue;
    const w = isoWeek(d);
    rows.push({ week: w.key, monday: w.monday, name: String(r.Teilnehmer ?? '–'), art: sportKey(r.Art),
                vals: (hasS ? [r.Strecke] : []).concat(r.Werte ?? []).map(Number) });
  }
  const map = new Map();
  rows.forEach(r => map.set(r.week, r.monday));
  weeks = [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  if (!weeks.some(w => w[0] === current)) current = weeks.length ? weeks[weeks.length - 1][0] : null;
  render();
});

function render() {
  const sel = $('week');
  sel.innerHTML = weeks.map(([k, mon]) => {
    const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
    return `<option value="${k}" ${k === current ? 'selected' : ''}>${k.replace('-', ' ')} (${fmt(mon)}–${fmt(sun)})</option>`;
  }).join('');
  const out = $('out');
  if (!current) { out.innerHTML = '<div class="empty">Keine Daten vorhanden.<br><small>' + (window.diag || '') + '</small></div>'; return; }

  const allOn = SPORTS.every(x => active[x.key]);
  const sel_rows = rows.filter(r => r.week === current && (allOn || active[r.art]));
  const sums = new Map();
  sel_rows.forEach(r => {
    const s = sums.get(r.name) || labels.map(() => 0);
    r.vals.forEach((v, i) => { s[i] += isNaN(v) ? 0 : v; });
    sums.set(r.name, s);
  });
  const total = labels.map((_, i) => [...sums.values()].reduce((a, s) => a + s[i], 0));
  const head = '<th>Platz</th><th>Teilnehmer</th>' + labels.map(l => `<th>${l}</th>`).join('');
  const sorted = [...sums.entries()].sort((a, b) => (b[1][0] || 0) - (a[1][0] || 0) || a[0].localeCompare(b[0]));
  let rank = 0;
  const body = sorted.map(([n, s], i) => {
    if (i === 0 || s[0] !== sorted[i - 1][1][0]) rank = i + 1;   // gleiche Werte = gleicher Platz
    return `<tr><td class="rk">${rank}.</td><td>${n}</td>${s.map(v => `<td>${num(v)}</td>`).join('')}</tr>`;
  }).join('');
  out.innerHTML = `<h2>Ranking nach ${labels[0] || 'Summe'}</h2>
    <div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>
    <tfoot><tr><td></td><td>Gesamt</td>${total.map(v => `<td>${num(v)}</td>`).join('')}</tr></tfoot></table></div>
    <h2>${sel_rows.length} Einträge</h2>`;
}

$('week').onchange = e => { current = e.target.value; render(); };
$('next').onclick = () => step(1);
$('prev').onclick = () => step(-1);
function step(d) {
  const i = weeks.findIndex(w => w[0] === current) + d;
  if (i >= 0 && i < weeks.length) { current = weeks[i][0]; render(); }
}
</script>
</body>
</html>
